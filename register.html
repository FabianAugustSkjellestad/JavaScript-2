<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connect - Register and connect with your friends on Connect.">
    <title>Connect | Register</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <script src="js/main/register.js" type="module"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <h2 class="logo">Connect</h2>
        </nav>    
    </header>
    <main>
        <h1>Register</h1>
        <section class="register-section">
            <h2 class="sr-only">Register form</h2>
            <form id="registerForm" class="auth-form">
                <div class="auth-field">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    <span id="nameError" class="error-message"></span>
                </div>
                <div class="auth-field">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Create password" required>
                    <span id="passwordError" class="error-message"></span>
                </div>
                <div>
                    <button type="submit" class="auth-button">Register</button>
                    <p>Already have an account?<a href="index.html" class="auth-extra-button">Log in here!</a></p>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <img src="favicon_io/favicon.ico" alt="connect logo" class="footer-logo">
        <p>&copy; 2026 Connect. All rights reserved.</p>
    </footer> 
</body>
</html>
