<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connect - Login and connect with your friends. Access your feed, share posts and stay updated with the latest content.">
    <title>Connect | Login</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <script src="js/main/login.js" type="module"></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-white site-nav">
            <div class="container">
                <a class="navbar-brand text-primary" href="index.html">Connect</a>
                </div>
        </nav>
    </header>
    <main class="auth-page">
        <div class="card auth-card">
            <div class="card-body p-4">
                <h1 class="h4 mb-4 text-center">Log in</h1>
                
                <form id="loginForm" novalidate>
                <div class="auth-field">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    <span id="emailError" class="error-message"></span>
                </div>
                <div class="auth-field">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="8" placeholder="Enter your password" required>
                    <span id="passwordError" class="error-message"></span>
                </div>

                    <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
                    <p class="text-center mt-3 mb-0">
                        Don't have an account?<a href="register.html">Register here!</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-light py-3 mt-5">
        <img src="favicon_io/favicon.ico" alt="connect logo" class="footer-logo" width="24" height="24">
        <p class="mb-0 mt-2">&copy; 2026 Connect. All rights reserved.</p>
    </footer>
</body>
</html>
